[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "extension-xray"
version = "1.0.0"
description = "Local-first static security analysis for VSIX packages and source repositories"
requires-python = ">=3.13"
keywords = ["security", "static-analysis", "supply-chain", "vscode", "sarif"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.18,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]

[project.scripts]
extension-xray = "app.cli:main"

[project.urls]
Documentation = "https://github.com/caiocesar333/Extension-X-Ray#readme"
Issues = "https://github.com/caiocesar333/Extension-X-Ray/issues"
Repository = "https://github.com/caiocesar333/Extension-X-Ray"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"app/data/osv-advisories.json" = "app/data/osv-advisories.json"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

